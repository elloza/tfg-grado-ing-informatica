title: |
  Final Degree Project
  Documentation in Computer
  Engineering in the AI Era
author: Alvaro Lozano Murciego
copyright: "2026"
logo: "_static/logo.png"
language: en
exclude_patterns: ["_build", "Thumbs.db", ".DS_Store", "**.ipynb_checkpoints", "_build_*", "es/", "_examples_archive/", "temp_build_*", "latex_templates*", "_TRASH*"]
execute:
  execute_notebooks: off
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
  use_download_button: true
  extra_navbar: |
    <div style="margin-top: 10px; font-size: 0.8em; color: #666;">
      Unofficial guide. Always check the current official regulations.
    </div>
html_theme_options:
  icon_links: []
sphinx:
  extra_extensions:
    - sphinx_apa_citations
    - sphinx_thebe
    - sphinxcontrib.bibtex
    - sphinx_kroki
  config:
    html_show_copyright: false
    suppress_warnings:
    - bibtex.duplicate_citation
    html_js_files:
    - custom.js
    bibtex_bibfiles:
    - _static/references.bib
    bibtex_default_style: plain
    bibtex_reference_style: apa_author_year
    thebe_config:
      always_load: false
      repository_url: https://github.com/binder-examples/jupyter-stacks-datascience
      repository_branch: master
      selector: ".thebe,.cell"
      selector_input: "pre"
      selector_output: ".output, .cell_output"
html:
  favicon: "_static/favicon.png"
  extra_footer: |
    <p>Living document by Alvaro Lozano Murciego (2026). Built with a modified version of <a href="https://teachbooks.io/">TeachBooks</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener noreferrer">CC BY 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt=""></a></p>
latex_docclass:
  book: jupyterBook
latex:
  latex_engine: xelatex
  options: "english"
  subtitle: "An unofficial, academic and practical guide for TFG documentation at USAL"
  header_title: |
    TFG Documentation
    in the AI Era
  institution: "Universidad de Salamanca"
  edition: "1st Edition"
  cover_logo: "_static/tfg-ia-cover-mark.png"
  preamble: |
    \usepackage[english]{babel}
    \selectlanguage{english}
