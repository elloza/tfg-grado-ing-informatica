title: |
  Documentación de un TFG
  en Ingeniería Informática
  en tiempos de IA
author: Álvaro Lozano Murciego
copyright: "2026"
logo: "_static/logo.png"
language: es
exclude_patterns: ["_build", "Thumbs.db", ".DS_Store", "**.ipynb_checkpoints", "_build_*", "en/", "_examples_archive/", "temp_build_*", "latex_templates*", "_TRASH*"]
execute:
  execute_notebooks: off
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
  use_download_button: true
  extra_navbar: |
    <div style="margin-top: 10px; font-size: 0.8em; color: #666;">
      Guía no oficial. Consulte siempre la normativa vigente.
    </div>
html_theme_options:
  icon_links: []
sphinx:
  extra_extensions:
    - sphinx_apa_citations
    - sphinx_thebe
    - sphinxcontrib.bibtex
    - sphinx_kroki
  config:
    html_show_copyright: false
    suppress_warnings:
    - bibtex.duplicate_citation
    html_js_files:
    - custom.js
    bibtex_bibfiles:
    - _static/references.bib
    bibtex_default_style: plain
    bibtex_reference_style: apa_author_year
    thebe_config:
      always_load: false
      repository_url: https://github.com/binder-examples/jupyter-stacks-datascience
      repository_branch: master
      selector: ".thebe,.cell"
      selector_input: "pre"
      selector_output: ".output, .cell_output"
html:
  favicon: "_static/favicon.png"
  extra_footer: |
    <p>Documento vivo de Álvaro Lozano Murciego (2026). Construido con una versión modificada de <a href="https://teachbooks.io/">TeachBooks</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener noreferrer">CC BY 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt=""></a></p>
latex_docclass:
  book: jupyterBook
latex:
  latex_engine: xelatex
  options: "spanish"
  subtitle: "Una guía no oficial, académica y práctica para documentar el TFG en la USAL"
  header_title: |
    Documentación de un TFG
    en tiempos de IA
  institution: "Universidad de Salamanca"
  edition: "1.ª edición"
  cover_logo: "_static/tfg-ia-cover-mark.png"
  preamble: |
    \usepackage[spanish]{babel}
    \selectlanguage{spanish}
